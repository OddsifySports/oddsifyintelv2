<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Oddsify Intel logo: dark rounded square with gold diamond + teal pupil -->
  <!-- Background plate -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#0f1623" stroke="#2a3346" stroke-width="1.5"/>
  <!-- Gold diamond -->
  <polygon points="32,10 54,32 32,54 10,32" fill="#f5b041" stroke="#d49119" stroke-width="1" stroke-linejoin="round"/>
  <!-- Teal pupil -->
  <circle cx="32" cy="32" r="6.5" fill="#0b0e14"/>
  <circle cx="32" cy="32" r="4" fill="#2dd4bf"/>
</svg>